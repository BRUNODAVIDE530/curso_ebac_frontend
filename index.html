<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Comaptible"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML com JS</title>
    <link rel="stylesheet" href="./main.css"/>
</head>
<body>
    <div class="container">
        <h1>Comparativo Numérico</h1>
        <h2>Numeros</h2>
        <form id="form-number">
            <input type="number"  id="numero-A" required placeholder="Primeiro Numero" />
            <input type="number" id="numero-B" required placeholder="Segundo Numero" />
            <button id="btn-depositar" type="submit">Calcular Diferença</button>
        </form>
        <p class="return-message"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
